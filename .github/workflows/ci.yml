name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MealRoute.sln

      - name: Build (core, view models, tests, CLI)
        run: |
          dotnet build src/MealRoute.Core -c Release --no-restore
          dotnet build src/MealRoute.App.ViewModels -c Release --no-restore
          dotnet build tools/MealRoute.Cli -c Release --no-restore
          dotnet build tests/MealRoute.Tests -c Release --no-restore

      - name: Test
        run: dotnet test tests/MealRoute.Tests -c Release --no-build --filter "Category!=Benchmark" --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Report failed tests as annotations
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Filter *.trx -Recurse | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName
            $trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | ForEach-Object {
              $msg = ($_.Output.ErrorInfo.Message -replace "`r?`n", ' ')
              if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
              Write-Output "::error title=$($_.testName)::$msg"
            }
          }

      - name: Test report (job summary)
        if: always()
        shell: pwsh
        run: |
          $lines = @('## Test report', '')
          $trxFiles = Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          if (-not $trxFiles) { $lines += 'No test results were produced.' }
          foreach ($file in $trxFiles) {
            [xml]$trx = Get-Content $file.FullName
            $c = $trx.TestRun.ResultSummary.Counters
            $t = $trx.TestRun.Times
            $seconds = [math]::Round(([datetime]$t.finish - [datetime]$t.start).TotalSeconds, 1)
            $lines += "**$($trx.TestRun.ResultSummary.outcome)**: $($c.passed) passed, $($c.failed) failed, $($c.notExecuted) skipped of $($c.total) in $seconds s (benchmarks excluded; commit $env:GITHUB_SHA)."
            $lines += ''
            # Test class per result: map testId -> class name through the definitions.
            $classOf = @{}
            foreach ($d in $trx.TestRun.TestDefinitions.UnitTest) { $classOf[$d.id] = $d.TestMethod.className }
            $lines += '| Test class | Passed | Failed |'
            $lines += '|---|---:|---:|'
            $trx.TestRun.Results.UnitTestResult | Group-Object { $classOf[$_.testId] -replace '^MealRoute\.Tests\.', '' } | Sort-Object Name | ForEach-Object {
              $passed = @($_.Group | Where-Object outcome -eq 'Passed').Count
              $failed = @($_.Group | Where-Object outcome -eq 'Failed').Count
              $lines += "| $($_.Name) | $passed | $failed |"
            }
            $failedTests = $trx.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed'
            if ($failedTests) {
              $lines += '', '### Failed', ''
              $failedTests | ForEach-Object { $lines += "- ``$($_.testName)``" }
            }
          }
          $lines += '', 'Full results: the `test-results` artifact (TRX) of this run.'
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Publish WinUI app (win-x64)
        run: dotnet publish src/MealRoute.App -c Release -r win-x64 -p:Platform=x64 -o publish/win-x64

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MealRoute-win-x64
          path: publish/win-x64

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
